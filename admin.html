<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הצבעת שדרוגים — בניין 110 — אדמין</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Arial,'Heebo',sans-serif; direction:rtl; background:#f0f2f5; color:#333; }
  .topbar { background:#fff; border-bottom:1px solid #ddd; padding:12px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; position:sticky; top:0; z-index:10; }
  .topbar h1 { font-size:16px; font-weight:800; flex:1; min-width:150px; }
  .badge { background:#e0f5ee; color:#0F6E56; font-size:13px; font-weight:700; padding:4px 12px; border-radius:20px; }
  .btn { font-size:13px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer; border:1px solid #ccc; background:#fff; font-family:inherit; }
  .btn-green { background:#1D9E75; color:#fff; border-color:#1D9E75; }
  .wrap { max-width:900px; margin:18px auto; padding:0 14px 50px; }
  .stats-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .stat { background:#fff; border:1px solid #ddd; border-radius:10px; padding:16px; text-align:center; }
  .stat .num { font-size:28px; font-weight:800; color:#1D9E75; }
  .stat .lbl { font-size:12px; color:#999; margin-top:2px; }
  .card { background:#fff; border:1px solid #ddd; border-radius:10px; padding:16px; }
  .dl-card { background:#fff8ec; border:1.5px solid #f5d9a8; border-radius:10px; padding:16px; margin-bottom:16px; }
  .dl-card h3 { font-size:14px; font-weight:800; color:#8a5a00; margin-bottom:4px; }
  .dl-now { font-size:13px; color:#8a5a00; margin-bottom:12px; }
  .dl-now b { font-weight:800; }
  .dl-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .dl-row input[type=datetime-local] { padding:8px 10px; border:1.5px solid #e0c088; border-radius:8px; font-size:14px; font-family:inherit; background:#fff; }
  .dl-btn { font-size:13px; font-weight:700; padding:9px 16px; border-radius:8px; cursor:pointer; border:none; font-family:inherit; }
  .dl-save { background:#1D9E75; color:#fff; }
  .dl-close { background:#c0392b; color:#fff; }
  .dl-open { background:#fff; color:#8a5a00; border:1.5px solid #e0c088; }
  .dl-msg { font-size:13px; margin-top:10px; font-weight:700; display:none; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:right; padding:9px 10px; border-bottom:2px solid #333; font-weight:700; background:#f5f5f5; white-space:nowrap; }
  td { padding:8px 10px; border-bottom:1px solid #eee; vertical-align:middle; }
  td img { height:42px; max-width:100px; }
  .loading, .err { text-align:center; padding:50px; color:#888; }
  .err { color:#c00; display:none; }
  @media print {
    .topbar, .no-print { display:none !important; }
    body { background:#fff; }
    .card, .stat { box-shadow:none; border:1px solid #333; }
    @page { size:A4; margin:1.4cm; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>הצבעת שדרוגים — בניין 110 — אדמין</h1>
  <span class="badge" id="countBadge">טוען…</span>
  <button class="btn" onclick="loadData()">🔄 רענן</button>
  <button class="btn btn-green no-print" onclick="window.print()">🖨️ הדפס / PDF</button>
</div>

<div class="wrap">
  <div class="loading" id="loadingMsg">טוען נתונים…</div>
  <div class="err" id="errMsg">שגיאה בטעינה</div>
  <div id="content" style="display:none">
    <div class="dl-card no-print">
      <h3>⏳ ניהול מועד ההצבעה</h3>
      <div class="dl-now" id="dlNow">טוען…</div>
      <div class="dl-row">
        <input type="datetime-local" id="dlInput" />
        <button class="dl-btn dl-save" onclick="setDeadline()">שמור מועד חדש</button>
        <button class="dl-btn dl-close" onclick="setDeadline('closed')">🔒 סגור עכשיו</button>
        <button class="dl-btn dl-open" onclick="setDeadline('open')">פתח ללא הגבלה</button>
      </div>
      <div class="dl-msg" id="dlMsg"></div>
    </div>

    <div class="stats-row" style="grid-template-columns:1fr 1fr 1fr 1fr">
      <div class="stat"><div class="num" id="stTotal">0</div><div class="lbl">הצביעו</div></div>
      <div class="stat"><div class="num" id="stPct" style="color:#0d6e52">0%</div><div class="lbl">בעד מכלל הבניין (52)</div></div>
      <div class="stat"><div class="num" id="stYes" style="color:#0d6e52">0</div><div class="lbl">👍 בעד</div></div>
      <div class="stat"><div class="num" id="stNo" style="color:#c0392b">0</div><div class="lbl">👎 נגד</div></div>
    </div>
    <div class="card">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxn7f1-PycwsK8oh9uElLX_L6pe_bCwP7cg64k5YM97ybZ0GTssn3p5ziJX-vb47yVW/exec';
const FORM_KEY   = 'שדרוגים';
// הסיסמה נבדקת בשרת בלבד — לא שמורה כאן
const ADMIN_PW = sessionStorage.getItem('admin_pw');

// מנטרל תווי HTML — הגנה מפני XSS דרך שדות שהוקלדו בטופס
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function fetchAll(pw){
  return fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ action:'formGetAll', form:FORM_KEY, password:pw }) }).then(r => r.json());
}

function showLogin(msg){
  document.body.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f0f2f5;font-family:Arial;direction:rtl">' +
    '<div style="background:#fff;border-radius:12px;padding:36px;width:300px;text-align:center;border:1px solid #ddd">' +
    '<div style="font-size:40px;margin-bottom:14px">🔒</div>' +
    '<h2 style="font-size:16px;margin:0 0 20px;font-weight:800">דף מנהל — נדרשת סיסמה</h2>' +
    '<input type="password" id="pwInput" placeholder="סיסמה" autofocus style="width:100%;padding:12px;border:1.5px solid #ccc;border-radius:8px;font-size:15px;text-align:center;margin-bottom:12px;font-family:inherit;direction:ltr" onkeydown="if(event.key===\'Enter\')window.checkPw()" />' +
    '<button id="pwBtn" onclick="window.checkPw()" style="width:100%;padding:12px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">כניסה</button>' +
    '<div id="pwErr" style="color:#c00;font-size:13px;margin-top:10px;' + (msg?'':'display:none') + '">' + (msg||'') + '</div>' +
    '</div></div>';
}
window.checkPw = function(){
  const val = document.getElementById('pwInput').value, btn = document.getElementById('pwBtn'), e = document.getElementById('pwErr');
  if (!val) return;
  btn.disabled = true; btn.textContent = 'בודק…';
  fetchAll(val).then(d => {
    if (d.status === 'ok') { sessionStorage.setItem('admin_pw', val); location.reload(); }
    else if (d.status === 'locked') { e.style.display='block'; e.textContent='🚫 יותר מדי ניסיונות — נחסם ל-15 דקות'; btn.disabled=false; btn.textContent='כניסה'; }
    else { e.style.display='block'; e.textContent='❌ סיסמה שגויה'; btn.disabled=false; btn.textContent='כניסה'; }
  }).catch(() => { e.style.display='block'; e.textContent='שגיאה בחיבור'; btn.disabled=false; btn.textContent='כניסה'; });
};

// ── ניהול מועד הסגירה ──
function fmtDL(v){
  if (v === 'closed') return 'ההצבעה סגורה 🔒';
  if (v === 'open' || !v) return 'פתוחה ללא הגבלת זמן';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const p = n => n < 10 ? '0'+n : n;
  return 'יום ' + days[d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth()+1) + '.' +
         String(d.getFullYear()).slice(2) + ' בשעה ' + p(d.getHours()) + ':' + p(d.getMinutes()) +
         (new Date() > d ? ' (עבר — ההצבעה סגורה)' : '');
}
function dlApi(body){
  return fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(Object.assign({ action:'formDeadline', form:FORM_KEY, password:ADMIN_PW }, body)) })
    .then(r => r.json());
}
function showDL(v){
  document.getElementById('dlNow').innerHTML = 'מועד נוכחי: <b>' + esc(fmtDL(v)) + '</b>';
  if (v && v !== 'closed' && v !== 'open') {
    const d = new Date(v);
    if (!isNaN(d)) {
      const p = n => n < 10 ? '0'+n : n;
      document.getElementById('dlInput').value =
        d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
  }
}
function dlMsg(text, ok){
  const m = document.getElementById('dlMsg');
  m.textContent = text; m.style.color = ok ? '#0d6e52' : '#c0392b'; m.style.display = 'block';
  setTimeout(() => { m.style.display = 'none'; }, 4000);
}
function setDeadline(preset){
  let val = preset;
  if (!val) {
    const raw = document.getElementById('dlInput').value;
    if (!raw) { dlMsg('יש לבחור תאריך ושעה', false); return; }
    val = new Date(raw).toISOString();
  }
  if (preset === 'closed' && !confirm('לסגור את ההצבעה עכשיו? דיירים לא יוכלו להצביע יותר.')) return;
  dlApi({ set: val }).then(d => {
    if (d.status === 'ok') { showDL(d.deadline); dlMsg('✓ המועד עודכן', true); }
    else if (d.status === 'locked') dlMsg('🚫 נחסם ל-15 דקות', false);
    else dlMsg('שגיאה בעדכון', false);
  }).catch(() => dlMsg('שגיאה בחיבור', false));
}

function loadData(){
  if (!ADMIN_PW) return;
  document.getElementById('loadingMsg').style.display='block';
  document.getElementById('content').style.display='none';
  document.getElementById('errMsg').style.display='none';
  fetchAll(ADMIN_PW).then(data => {
    if (data.status === 'locked') { document.getElementById('loadingMsg').style.display='none'; const e=document.getElementById('errMsg'); e.style.display='block'; e.textContent='🚫 יותר מדי ניסיונות שגויים — נסה שוב בעוד 15 דקות'; return; }
    if (data.status !== 'ok') { sessionStorage.removeItem('admin_pw'); location.reload(); return; }
    render(data.entries || []);
    dlApi({}).then(d => { if (d.status === 'ok') showDL(d.deadline); });
  }).catch(() => { document.getElementById('loadingMsg').style.display='none'; document.getElementById('errMsg').style.display='block'; });
}

function render(entries){
  document.getElementById('loadingMsg').style.display='none';
  document.getElementById('content').style.display='block';
  const apts = new Set(entries.map(e => parseInt(e.apt)).filter(n => !isNaN(n)));
  document.getElementById('stTotal').textContent = entries.length;
  const yesCount = entries.filter(e => e.choice === 'בעד').length;
  const noCount  = entries.filter(e => e.choice === 'נגד').length;
  document.getElementById('stYes').textContent = yesCount;
  document.getElementById('stNo').textContent  = noCount;
  document.getElementById('stPct').textContent = Math.round(yesCount / 52 * 100) + '%';
  document.getElementById('countBadge').textContent = entries.length + ' רשומות';

  // עמודות: לפי המפתחות של הרשומה הראשונה, עם ts אחרון
  const cols = entries.length ? Object.keys(entries[0]).filter(c => c !== 'ts').concat('ts') : [];
  const thead = document.getElementById('thead');
  thead.innerHTML = '<th class="num-col">#</th>' + cols.map(c => '<th>' + esc(c) + '</th>').join('');

  const tbody = document.getElementById('tbody'); tbody.innerHTML = '';
  entries.slice().sort((a,b) => (parseInt(a.apt)||999) - (parseInt(b.apt)||999)).forEach((e, i) => {
    const tr = document.createElement('tr');
    let html = '<td>' + (i+1) + '</td>';
    cols.forEach(c => {
      const v = e[c] || '';
      // חתימה base64 → תמונה; כל שאר השדות עוברים escape (הגנת XSS)
      if ((c === 'sig' || c === 'signature') && String(v).startsWith('data:image')) {
        html += '<td><img src="' + esc(v) + '"/></td>';
      } else {
        html += '<td>' + esc(v) + '</td>';
      }
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
}

if (!ADMIN_PW) { document.addEventListener('DOMContentLoaded', () => showLogin()); }
else { loadData(); }
</script>
</body>
</html>
